name: Build Desktop v0.2.0-rc.2 (Auto Sync Tags)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "Error: Tag not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      # 根据 .env.windows.example 模板内容分析，需要设置以下变量：
      # 1. DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN - 必填，需HTTPS开头（上一轮报错的直接原因）
      # 2. DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN - 模板中也为空，可能也会被校验拦截
      # 3. DOWNLOAD_TEST_RELEASE_ID - 注释标注"Required for test releases"，需32位小写十六进制
      - name: Prepare Desktop Environment File
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp apps/desktop/.env.windows.example apps/desktop/.env.windows
            
            # 安全替换：先grep检查变量是否存在，存在则sed替换，不存在则echo追加
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=" apps/desktop/.env.windows; then
              sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' apps/desktop/.env.windows
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> apps/desktop/.env.windows
            fi
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=" apps/desktop/.env.windows; then
              sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' apps/desktop/.env.windows
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> apps/desktop/.env.windows
            fi
            
            if grep -q "^DOWNLOAD_TEST_RELEASE_ID=" apps/desktop/.env.windows; then
              sed -i 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' apps/desktop/.env.windows
            else
              echo "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" >> apps/desktop/.env.windows
            fi
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp apps/desktop/.env.macos.example apps/desktop/.env.macos
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=" apps/desktop/.env.macos; then
              sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' apps/desktop/.env.macos
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> apps/desktop/.env.macos
            fi
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=" apps/desktop/.env.macos; then
              sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' apps/desktop/.env.macos
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> apps/desktop/.env.macos
            fi
            
            if grep -q "^DOWNLOAD_TEST_RELEASE_ID=" apps/desktop/.env.macos; then
              sed -i '' 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' apps/desktop/.env.macos
            else
              echo "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" >> apps/desktop/.env.macos
            fi
          fi
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
