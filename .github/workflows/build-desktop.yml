name: Build Desktop v0.2.0-rc.2 (Final Bypass)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      - name: Prepare Env & Fake Cert
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ENV_FILE="apps/desktop/.env.windows"
            cp apps/desktop/.env.windows.example "$ENV_FILE"
            
            # 1. 生成一个【带有代码签名扩展】的假证书（绕过官方严格校验）
            mkdir -p fake-certs
            MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 \
              -keyout fake-certs/key.pem -out fake-certs/cert.cer \
              -days 1 -nodes -subj "/CN=FakeCodeSignCert" \
              -addext extendedKeyUsage=codeSigning
            
            # 2. 将证书路径写入 .env.windows
            CERT_PATH="$(pwd)/fake-certs/cert.cer"
            
            # 3. 逐条注入环境变量
            sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' "$ENV_FILE" || echo "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" >> "$ENV_FILE"
            sed -i "s|^DSH_DESKTOP_WINDOWS_CER_FILE=.*|DSH_DESKTOP_WINDOWS_CER_FILE=$CERT_PATH|" "$ENV_FILE" || echo "DSH_DESKTOP_WINDOWS_CER_FILE=$CERT_PATH" >> "$ENV_FILE"
            
            echo "✅ Valid Code Signing Fake Cert injected at: $CERT_PATH"

          elif [ "$RUNNER_OS" == "macOS" ]; then
            ENV_FILE="apps/desktop/.env.macos"
            cp apps/desktop/.env.macos.example "$ENV_FILE"
            
            # macOS 逐条注入环境变量
            sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i '' 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            sed -i '' 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' "$ENV_FILE" || echo "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" >> "$ENV_FILE"
            
            echo "✅ macOS Env files prepared successfully"
          fi
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
