name: Build Desktop v0.2.0-rc.2 (Auto Sync Tags)

on:
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest] # 同时在 Win 和 Mac 虚拟机上打包

    steps:
      # 1. 拉取你 Fork 仓库的当前代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 自动从官方原仓库拉取所有 Tags（无需推送回 Fork）
      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      # 3. 切换到指定的旧版本代码
      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)

      # 4. 配置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. 配置 pnpm 包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      # 6. 安装项目依赖
      - name: Install Dependencies
        run: pnpm install

      # 7. 构建仓库基础产物
      - name: Build Repository
        run: pnpm run build

      # 8. 【关键修复】自动创建打包所需的环境变量配置文件
      - name: Prepare Desktop Environment File
        run: |
          # 如果是 Windows 环境，复制 .env.windows.example
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp apps/desktop/.env.windows.example apps/desktop/.env.windows
          # 如果是 macOS 环境，复制 .env.macos.example
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp apps/desktop/.env.macos.example apps/desktop/.env.macos
          fi
        shell: bash

      # 9. 执行桌面端打包命令
      - name: Package Desktop App
        run: pnpm run package:desktop

      # 10. 上传打包产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
