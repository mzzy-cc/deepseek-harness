name: Build Desktop v0.2.0-rc.2 (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client (Unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
        shell: bash

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      # 【关键修复】：Unsigned 模式仍需 .env.windows 文件存在
      - name: Create .env.windows for Unsigned Build
        run: |
          $envFile = "apps/desktop/.env.windows"
          if (Test-Path "apps/desktop/.env.windows.example") {
            Copy-Item "apps/desktop/.env.windows.example" $envFile
          } else {
            # 如果 example 文件也不存在，则创建最小可用配置
            @"
DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com
DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com
DOWNLOAD_TEST_ORIGIN=https://deepseek.com
DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000
"@ | Set-Content $envFile
          }
          Write-Host "✅ .env.windows created at: $envFile"
          Get-Content $envFile
        shell: pwsh

      - name: Package Desktop App (Unsigned)
        run: pnpm run package:desktop:win:x64:unsigned
        env:
          DSH_DESKTOP_APP_ID: com.example.deepseek-harness

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-unsigned-v0.2.0-rc.2
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: warn
