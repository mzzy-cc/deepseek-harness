name: Build Desktop v0.2.0-rc.2 (Auto Sync Tags)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      # 【终极完善版】：一次性注入所有打包校验所需的测试环境变量
      - name: Prepare Desktop Environment File Safely
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ENV_FILE="apps/desktop/.env.windows"
            cp apps/desktop/.env.windows.example "$ENV_FILE"
            
            # 注入所有必需的测试 Origin
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=" "$ENV_FILE"; then
              sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=" "$ENV_FILE"; then
              sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
            
            # 修复本次报错：注入 DOWNLOAD_TEST_ORIGIN
            if grep -q "^DOWNLOAD_TEST_ORIGIN=" "$ENV_FILE"; then
              sed -i 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
            
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ENV_FILE="apps/desktop/.env.macos"
            cp apps/desktop/.env.macos.example "$ENV_FILE"
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=" "$ENV_FILE"; then
              sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
            
            if grep -q "^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=" "$ENV_FILE"; then
              sed -i '' 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
            
            if grep -q "^DOWNLOAD_TEST_ORIGIN=" "$ENV_FILE"; then
              sed -i '' 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            else
              echo "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
            fi
          fi
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
