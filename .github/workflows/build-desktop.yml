name: Build Desktop v0.2.0-rc.2 (Windows Only)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
        shell: bash

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      - name: Prepare Env & Bypass Signing
        run: |
          ENV_FILE="apps/desktop/.env.windows"
          cp apps/desktop/.env.windows.example "$ENV_FILE"
          
          # 1. 注入所有必需的测试变量
          sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
          sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
          sed -i 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE" || echo "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" >> "$ENV_FILE"
          sed -i 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' "$ENV_FILE" || echo "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" >> "$ENV_FILE"
          
          # 2. 【核心手术】：直接清空 windows-sign.mjs 中的关键函数
          SIGN_SCRIPT="apps/desktop/scripts/windows-sign.mjs"
          if [ -f "$SIGN_SCRIPT" ]; then
            perl -i -0pe 's/async function createWindowsTokenSigner\(.*?\n\}/async function createWindowsTokenSigner() {\n  console.warn("⚠️ Bypassing Windows Code Signing...");\n  return null;\n}/gs' "$SIGN_SCRIPT"
            echo "✅ windows-sign.mjs has been surgically modified."
          else
            echo "❌ Error: $SIGN_SCRIPT not found!"
            exit 1
          fi
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
          if-no-files-found: warn
