name: Build Desktop v0.2.0-rc.2 (PowerShell Cert Bypass)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
        shell: bash

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      # 【终极方案】：使用 PowerShell 生成标准代码签名证书，并用 Bash 注入环境变量
      - name: Generate Valid Code Signing Cert & Inject Env
        run: |
          # 1. 使用 PowerShell 生成并导出证书
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=FakeCodeSignCert" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
          $pwd = ConvertTo-SecureString -String "FakePassword123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "fake-cert.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "fake-cert.cer" -Type CERT
          
          # 获取绝对路径并写入环境变量文件
          $cerPath = (Resolve-Path "fake-cert.cer").Path
          $envFile = "apps/desktop/.env.windows"
          Copy-Item "apps/desktop/.env.windows.example" $envFile
          
          # 2. 使用 PowerShell 替换环境变量（比 sed 在 Windows 上稳定 100 倍）
          (Get-Content $envFile) -replace '^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*', "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com" | Set-Content $envFile
          (Get-Content $envFile) -replace '^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*', "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com" | Set-Content $envFile
          (Get-Content $envFile) -replace '^DOWNLOAD_TEST_ORIGIN=.*', "DOWNLOAD_TEST_ORIGIN=https://deepseek.com" | Set-Content $envFile
          (Get-Content $envFile) -replace '^DOWNLOAD_TEST_RELEASE_ID=.*', "DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000" | Set-Content $envFile
          (Get-Content $envFile) -replace '^DSH_DESKTOP_WINDOWS_CER_FILE=.*', "DSH_DESKTOP_WINDOWS_CER_FILE=$cerPath" | Set-Content $envFile
          
          Write-Host "✅ Valid cert generated at: $cerPath"
        shell: pwsh

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
          if-no-files-found: warn
