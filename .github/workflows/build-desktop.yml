name: Build Desktop v0.2.0-rc.2 (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client (Unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
        shell: bash

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      - name: Package Desktop App (Unsigned)
        run: pnpm run package:desktop:win:x64:unsigned
        env:
          DSH_DESKTOP_APP_ID: com.example.deepseek-harness

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-unsigned-v0.2.0-rc.2
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: warn
