name: Build Desktop v0.2.0-rc.2 (Auto Sync Tags & Bypass Sign)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "Error: Tag not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      - name: Prepare Desktop Environment File
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ENV_FILE="apps/desktop/.env.windows"
            cp apps/desktop/.env.windows.example "$ENV_FILE"
            
            # GNU sed on Windows: sed -i 'pattern' file
            SED="sed -i"
            
            # 注入所有必需的测试变量
            $SED 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' "$ENV_FILE"

            # 绕过 Windows 代码签名校验
            SIGN_SCRIPT="apps/desktop/scripts/windows-sign.mjs"
            if [ -f "$SIGN_SCRIPT" ]; then
              $SED 's|throw new Error("DSH_DESKTOP_WINDOWS_CER_FILE must identify the public X.509 leaf certificate file");|console.warn("Bypassing Windows Code Signing for local build..."); return null;|g' "$SIGN_SCRIPT"
              echo "Windows signing bypass applied."
            fi
            
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ENV_FILE="apps/desktop/.env.macos"
            cp apps/desktop/.env.macos.example "$ENV_FILE"
            
            # BSD sed on macOS: sed -i '' 'pattern' file (空字符串=不生成备份)
            SED="sed -i ''"
            
            # 注入所有必需的测试变量
            $SED 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://deepseek.com|' "$ENV_FILE"
            $SED 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000|' "$ENV_FILE"
          fi
          
          echo "=== Environment file contents ==="
          cat "$ENV_FILE"
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
