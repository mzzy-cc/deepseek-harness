name: Build Desktop v0.2.0-rc.2 (Auto Sync Tags & Bypass Sign)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Tags from Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags

      - name: Checkout Specific Tag
        run: |
          git checkout dsh-v0.2.0-rc.2 || git checkout v0.2.0-rc.2 || (echo "❌ Error: Tag not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Repository
        run: pnpm run build

      # 【破壁操作】：注入环境变量 + 绕过 Windows 签名校验
      - name: Prepare Env & Bypass Signing
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ENV_FILE="apps/desktop/.env.windows"
            cp apps/desktop/.env.windows.example "$ENV_FILE"
            SED_CMD="sed -i"
            
            # 1. 注入测试变量
            declare -A ENV_VARS=(
              ["DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN"]="https://deepseek.com"
              ["DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN"]="https://deepseek.com"
              ["DOWNLOAD_TEST_ORIGIN"]="https://deepseek.com"
              ["DOWNLOAD_TEST_RELEASE_ID"]="00000000000000000000000000000000"
            )
            for KEY in "${!ENV_VARS[@]}"; do
              VALUE="${ENV_VARS[$KEY]}"
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                $SED_CMD "s|^${KEY}=.*|${KEY}=${VALUE}|" "$ENV_FILE"
              else
                echo "${KEY}=${VALUE}" >> "$ENV_FILE"
              fi
            done

            # 2. 【关键】注释掉 windows-sign.mjs 中的证书强制校验
            # 找到 resolveCertificateFile 函数中的 throw new Error，将其注释掉或改为 return null
            SIGN_SCRIPT="apps/desktop/scripts/windows-sign.mjs"
            if [ -f "$SIGN_SCRIPT" ]; then
              # 尝试将强制报错的行替换为 console.warn 并返回空，从而跳过签名
              $SED_CMD 's|throw new Error("DSH_DESKTOP_WINDOWS_CER_FILE must identify the public X.509 leaf certificate file");|console.warn("⚠️ Bypassing Windows Code Signing for local build..."); return null;|g' "$SIGN_SCRIPT"
              echo "✅ Windows signing bypass applied."
            fi

          elif [ "$RUNNER_OS" == "macOS" ]; then
            ENV_FILE="apps/desktop/.env.macos"
            cp apps/desktop/.env.macos.example "$ENV_FILE"
            SED_CMD="sed -i ''"
            
            declare -A ENV_VARS=(
              ["DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN"]="https://deepseek.com"
              ["DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN"]="https://deepseek.com"
              ["DOWNLOAD_TEST_ORIGIN"]="https://deepseek.com"
              ["DOWNLOAD_TEST_RELEASE_ID"]="00000000000000000000000000000000"
            )
            for KEY in "${!ENV_VARS[@]}"; do
              VALUE="${ENV_VARS[$KEY]}"
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                $SED_CMD "s|^${KEY}=.*|${KEY}=${VALUE}|" "$ENV_FILE"
              else
                echo "${KEY}=${VALUE}" >> "$ENV_FILE"
              fi
            done
          fi
        shell: bash

      - name: Package Desktop App
        run: pnpm run package:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-v0.2.0-rc.2
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn
